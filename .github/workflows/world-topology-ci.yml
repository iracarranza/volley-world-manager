name: World Topology CI

on:
  push:
    paths:
      - "scripts/data/world_panel_topology.gd"
      - "scripts/world/world_surface_mapper.gd"
      - "tests/world_topology_contract.gd"
      - "tools/render_world_topology_proof.gd"
      - ".github/workflows/world-topology-ci.yml"
  pull_request:
    paths:
      - "scripts/data/world_panel_topology.gd"
      - "scripts/world/world_surface_mapper.gd"
      - "tests/world_topology_contract.gd"
      - "tools/render_world_topology_proof.gd"
      - ".github/workflows/world-topology-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-topology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    name: Godot 4.7.2 / world topology authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
      - name: Validate world topology contract
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/world_topology_contract.gd
      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Render topology proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            --script tools/render_world_topology_proof.gd
          test "$(find artifacts/world-surface -type f -name 'topology_*.png' | wc -l)" -eq 4
          test -s artifacts/world-surface/topology_flat.png
          test -s artifacts/world-surface/topology_globe_landavol.png
          test -s artifacts/world-surface/topology_globe_opposite.png
          test -s artifacts/world-surface/topology_globe_pole.png
      - name: Upload topology proof
        uses: actions/upload-artifact@v4
        with:
          name: world-topology-proof
          path: artifacts/world-surface/topology_*.png
          if-no-files-found: error
          retention-days: 14
