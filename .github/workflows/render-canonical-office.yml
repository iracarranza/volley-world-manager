name: Render canonical office

on:
  push:
    branches:
      - chatgpt/canonical-office-greybox
    paths:
      - 'scenes/office/**'
      - 'tools/render_canonical_office_greybox.gd'
      - 'tools/render_canonical_office_low_poly.gd'
      - 'tools/render_current_title_screen.gd'
      - '.github/workflows/render-canonical-office.yml'
      - 'project.godot'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64

      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path . --quit-after 3

      - name: Render current title screen
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script tools/render_current_title_screen.gd
          ls -lh artifacts/current-title-screen/

      - name: Render seven greybox cameras
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script tools/render_canonical_office_greybox.gd
          ls -lh artifacts/canonical-office-greybox/

      - name: Render seven low-poly cameras
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script tools/render_canonical_office_low_poly.gd
          ls -lh artifacts/canonical-office-low-poly/

      - name: Upload current title screen
        uses: actions/upload-artifact@v4
        with:
          name: current-title-screen-render
          path: artifacts/current-title-screen/title_screen.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload greybox render packet
        uses: actions/upload-artifact@v4
        with:
          name: canonical-office-greybox-renders
          path: artifacts/canonical-office-greybox/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload low-poly render packet
        uses: actions/upload-artifact@v4
        with:
          name: canonical-office-low-poly-renders
          path: artifacts/canonical-office-low-poly/*.png
          if-no-files-found: error
          retention-days: 14
