name: Godot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot 4.7.2 / headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Validate domain registry contracts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tools/validate_domain_registries.gd

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Render creation-flow drafts
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            --script tools/render_creation_flow_v2.gd
          test "$(find artifacts/creation-flow-drafts -type f -name '*.png' | wc -l)" -eq 26

      - name: Upload creation-flow drafts
        uses: actions/upload-artifact@v4
        with:
          name: creation-flow-drafts
          path: artifacts/creation-flow-drafts/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Render Q1 vignette videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/q1-videos
          for mode in quick read hitter; do
            xvfb-run -a godot --path . --rendering-method gl_compatibility \
              --write-movie "artifacts/q1-videos/q1_${mode}.avi" --fixed-fps 30 \
              --script tools/render_q1_vignette_movie.gd -- "$mode"
          done
          test "$(find artifacts/q1-videos -type f -name 'q1_*.avi' | wc -l)" -eq 3
          test -s artifacts/q1-videos/q1_quick.avi
          test -s artifacts/q1-videos/q1_read.avi
          test -s artifacts/q1-videos/q1_hitter.avi

      - name: Upload Q1 vignette videos
        uses: actions/upload-artifact@v4
        with:
          name: q1-vignette-videos
          path: artifacts/q1-videos/*.avi
          if-no-files-found: error
          retention-days: 14

      - name: Render surface-mark gallery
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            --script tools/render_surface_mark_gallery.gd

      - name: Upload surface-mark gallery
        uses: actions/upload-artifact@v4
        with:
          name: surface-mark-previews
          path: artifacts/mark-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Render Voli headshots
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            --script tools/render_voli_headshot_gallery.gd

      - name: Upload Voli headshots
        uses: actions/upload-artifact@v4
        with:
          name: voli-headshot-previews
          path: artifacts/headshot-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Render regional court gallery
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            res://tools/visual_court_gallery_cert.tscn
          mkdir -p artifacts/visual-courts
          find "$HOME/.local/share/godot" -type f -name 'venue_*.png' -print -exec cp {} artifacts/visual-courts/ \;
          test "$(find artifacts/visual-courts -type f -name 'venue_*.png' | wc -l)" -ge 32

      - name: Upload regional court gallery
        uses: actions/upload-artifact@v4
        with:
          name: visual-court-gallery
          path: artifacts/visual-courts/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Render signature VFX gallery
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            res://tools/signature_vfx_gallery.tscn
          test "$(find artifacts/signature-vfx -type f -name '*.png' | wc -l)" -ge 15

      - name: Upload signature VFX gallery
        uses: actions/upload-artifact@v4
        with:
          name: signature-vfx-gallery
          path: artifacts/signature-vfx/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Run foundation suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/test_runner.gd
