name: Venue Render CI

on:
  push:
    branches:
      - chatgpt/pawa-backdrop-pass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venue-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Godot 4.7.2 / venue probe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Render current venues
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            res://tools/venue_probe.tscn

      - name: Collect rendered frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/venue-previews
          find "$HOME/.local/share/godot" -type f -name 'venue_*.png' -print -exec cp {} artifacts/venue-previews/ \;
          test -f artifacts/venue-previews/venue_pawa.png
          test -f artifacts/venue-previews/venue_pawa_close.png
          test -f artifacts/venue-previews/venue_pawa_wide.png

      - name: Upload venue frames
        uses: actions/upload-artifact@v4
        with:
          name: venue-previews
          path: artifacts/venue-previews/*.png
          if-no-files-found: error
          retention-days: 14
