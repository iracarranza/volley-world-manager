name: World Geography CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-geography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geography:
    name: Godot 4.7.2 / world geography authority
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Validate canonical geography contract
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/world_geography_contract.gd

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Render physical and political geography proofs
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            --script tools/render_world_geography_proof.gd
          test -s artifacts/world-geography/geography_flat.png
          test -s artifacts/world-geography/politics_flat.png
          test -s artifacts/world-geography/geography_globe_landavol.png
          test -s artifacts/world-geography/geography_globe_opposite.png
          test -s artifacts/world-geography/geography_globe_pole.png
          test -s artifacts/world-geography/politics_globe_landavol.png

      - name: Upload world geography proof
        uses: actions/upload-artifact@v4
        with:
          name: world-geography-proof
          path: artifacts/world-geography/*.png
          if-no-files-found: error
          retention-days: 14
