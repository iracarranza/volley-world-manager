name: Render Voli face comparison

on:
  push:
    branches:
      - chatgpt/voli-face-comparison
    paths:
      - 'tools/render_voli_face_comparison.gd'
      - 'tools/render_voli_expression_pass2.gd'
      - 'tools/render_voli_expression_pass2_refined.gd'
      - 'tools/render_voli_body_design_passes.gd'
      - 'tools/render_voli_body_redesign_pass2.gd'
      - 'tools/render_voli_body_redesign_pass3.gd'
      - 'scenes/components/player_actor_3d.gd'
      - 'scenes/components/player_actor_3d.tscn'
      - 'scripts/data/face_expressions.gd'
      - 'scripts/data/body_type_models.gd'
      - '.github/workflows/render-voli-face-comparison.yml'
      - 'project.godot'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64

      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path . --quit-after 3

      - name: Render production Voli face study
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1920x1080 \
            --script tools/render_voli_face_comparison.gd
          ls -lh artifacts/voli-face-comparison/

      - name: Render Voli expression pass 2
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1920x1080 \
            --script tools/render_voli_expression_pass2.gd
          ls -lh artifacts/voli-expression-pass2/

      - name: Render refined Voli expression pass 2
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1920x1080 \
            --script tools/render_voli_expression_pass2_refined.gd
          ls -lh artifacts/voli-expression-pass2-refined/

      - name: Render Voli body redesign passes
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1920x1080 \
            --script tools/render_voli_body_design_passes.gd
          ls -lh artifacts/voli-body-design-pass/

      - name: Render integrated Voli body redesign pass
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1920x1080 \
            --script tools/render_voli_body_redesign_pass2.gd
          ls -lh artifacts/voli-body-redesign-pass2/

      - name: Render refined integrated Voli body pass
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --resolution 1920x1080 \
            --script tools/render_voli_body_redesign_pass3.gd
          ls -lh artifacts/voli-body-redesign-pass3/

      - name: Upload Voli face render packet
        uses: actions/upload-artifact@v4
        with:
          name: voli-face-comparison-godot
          path: |
            artifacts/voli-face-comparison/*.png
            artifacts/voli-expression-pass2/*.png
            artifacts/voli-expression-pass2-refined/*.png
            artifacts/voli-body-design-pass/*.png
            artifacts/voli-body-redesign-pass2/*.png
            artifacts/voli-body-redesign-pass3/*.png
          if-no-files-found: error
          retention-days: 14
