name: Repair modularity registry
on:
  push:
    branches: [chatgpt/modularity-efficiency-refactor]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'Run registry repair' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/modularity-efficiency-refactor
          fetch-depth: 0
      - run: git fetch origin claude/m8-visual-continuity
      - run: python3 tools/repair_modularity_registry.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/domain scripts/simulation/setter_decision_math.gd
          git commit -m "Repair modular domain registries"
          git push origin HEAD:chatgpt/modularity-efficiency-refactor
