name: Reconcile Reception Authority

on:
  push:
    branches:
      - integration/reconcile-reception-authority

permissions:
  contents: write

concurrency:
  group: reconcile-reception-authority
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[reconciled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/reconcile-reception-authority

      - name: Build semantic patch and apply what still matches
        id: patch
        shell: bash
        run: |
          set +e
          git diff dfd7574f2128dec4cbe7badfb2447dd7e7c85a87^ dfd7574f2128dec4cbe7badfb2447dd7e7c85a87 -- \
            scripts/managers/game_manager.gd \
            scripts/simulation/rally_simulator.gd \
            tests/test_runner.gd > /tmp/reception-authority.patch
          git apply --reject --whitespace=nowarn /tmp/reception-authority.patch 2>&1 | tee /tmp/apply.log
          code=${PIPESTATUS[0]}
          mkdir -p /tmp/reconcile-diagnostics
          cp /tmp/reception-authority.patch /tmp/reconcile-diagnostics/source.patch
          cp /tmp/apply.log /tmp/reconcile-diagnostics/apply.log
          git status --short > /tmp/reconcile-diagnostics/status.txt
          git diff > /tmp/reconcile-diagnostics/applied.diff
          find scripts tests -name '*.rej' -print | while read -r f; do
            mkdir -p "/tmp/reconcile-diagnostics/$(dirname "$f")"
            cp "$f" "/tmp/reconcile-diagnostics/$f"
          done
          echo "apply_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload reconciliation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: reception-reconciliation-diagnostics
          path: /tmp/reconcile-diagnostics

      - name: Stop after diagnostic reject pass
        if: ${{ steps.patch.outputs.apply_code != '0' }}
        run: exit 1

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run focused reception authority probe
        run: godot --headless --path . --script tools/run_serve_reception_authority_probe.gd

      - name: Run full suite
        run: godot --headless --path . --script tests/test_runner.gd
