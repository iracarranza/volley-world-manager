name: Career navigation fast check

on:
  push:
    branches:
      - chatgpt/career-navigation
    paths:
      - 'scenes/application.gd'
      - 'scenes/application.tscn'
      - 'scenes/office/**'
      - 'scenes/components/career_navigation.gd'
      - 'scenes/components/screen_shell.gd'
      - 'scenes/screens/title_screen.gd'
      - 'scenes/screens/title_screen.tscn'
      - 'scenes/screens/desk_screen.gd'
      - 'scenes/screens/journal_screen.gd'
      - 'scenes/screens/journal_screen.tscn'
      - 'scenes/screens/training_screen.gd'
      - 'scenes/screens/scouting_screen.gd'
      - 'scenes/screens/schedule_screen.gd'
      - 'scenes/screens/accommodation_screen.gd'
      - 'scenes/screens/kitchen_screen.gd'
      - 'scenes/screens/encyclopedia_screen.gd'
      - 'tests/test_career_navigation.gd'
      - 'tests/test_application_navigation.gd'
      - 'tests/test_application_navigation.tscn'
      - 'tools/render_career_navigation.gd'
      - 'tools/render_career_navigation.tscn'
      - '.github/workflows/career-navigation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Run navigation component regression test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/test_career_navigation.gd

      - name: Run Application routing regression test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . res://tests/test_application_navigation.tscn

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Render navigation review packet
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility \
            --resolution 1280x720 \
            res://tools/render_career_navigation.tscn
          test "$(find artifacts/career-navigation -type f -name '*.png' | wc -l)" -eq 3

      - name: Upload navigation review packet
        uses: actions/upload-artifact@v4
        with:
          name: career-navigation-preview
          path: artifacts/career-navigation/*.png
          if-no-files-found: error
          retention-days: 14
