name: M9 Tactical A/B Probe

on:
  push:
    branches:
      - chatgpt/m9-tactical-ab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-tactical-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Godot 4.7.2 / M9 tactical A-B
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      - name: Parse and import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Run M9 tactical A/B probe
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tools/run_tactical_ab_probe.gd
