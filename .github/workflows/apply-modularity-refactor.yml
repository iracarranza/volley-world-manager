name: Apply modularity refactor

on:
  push:
    branches:
      - chatgpt/modularity-efficiency-refactor

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply modularity and efficiency refactor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/modularity-efficiency-refactor
          fetch-depth: 0

      - name: Apply guarded refactor
        run: python3 tools/apply_modularity_refactor.py

      - name: Verify generated files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/domain/attribute_registry.gd
          test -s scripts/domain/region_profiles.gd
          test -s scripts/domain/role_profiles.gd
          test -s scripts/domain/body_type_gameplay.gd
          test -s scripts/data/vertical_slice_roster.gd
          test -s scripts/simulation/setter_decision_math.gd
          test -s tools/validate_domain_registries.gd
          git diff --check

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tools docs
          git commit -m "Apply modularity and efficiency refactor"
          git push origin HEAD:chatgpt/modularity-efficiency-refactor
