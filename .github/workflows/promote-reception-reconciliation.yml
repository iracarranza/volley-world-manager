name: Promote Reception Reconciliation

on:
  workflow_run:
    workflows: ["Reconcile Reception Authority"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'integration/reconcile-reception-authority' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Promote only tested production/test files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration/reconcile-reception-authority
          tip="$(git rev-parse FETCH_HEAD)"
          message="$(git log -1 --format=%B "$tip")"
          if [[ "$message" != *"[reconciled]"* ]]; then
            echo "Reconciliation run succeeded but did not publish its tested commit."
            exit 1
          fi
          for path in \
            scripts/managers/game_manager.gd \
            scripts/simulation/rally_simulator.gd \
            tests/test_runner.gd; do
            git show "$tip:$path" > "$path"
            git add "$path"
          done
          # The promoter itself is temporary. Removing it in the same commit
          # leaves main with only the tested reconciliation content.
          git rm .github/workflows/promote-reception-reconciliation.yml
          git diff --cached --check
          git commit -m "Reconcile deterministic serve reception authority"
          git push origin HEAD:main
          gh issue close 18 --repo iracarranza/volley-world-manager --reason completed --comment \
            "Reconciled onto main after the focused reception-authority test, serve-reception authority probe, and full foundation suite all passed on the current-main port."
