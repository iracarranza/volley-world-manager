name: Final modularity repair
on:
  push:
    branches: [chatgpt/modularity-efficiency-refactor]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'Run final modularity repair' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/modularity-efficiency-refactor
          fetch-depth: 0
      - run: git fetch origin claude/m8-visual-continuity
      - name: Make constant parser ignore comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/repair_modularity_refactor_final.py')
          s = p.read_text()
          old = '''            else:\n                if ch in ('\"', "'"):\n                    quote = ch\n                elif ch in pairs:\n'''
          new = '''            else:\n                if ch == "#":\n                    newline = source.find("\\n", i)\n                    if newline < 0:\n                        raise RuntimeError(f"unterminated constant comment: {name}")\n                    i = newline\n                elif ch in ('\"', "'"):\n                    quote = ch\n                elif ch in pairs:\n'''
          if old not in s:
              raise SystemExit('parser patch anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: python3 tools/repair_modularity_refactor_final.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tools/validate_domain_registries.gd docs
          git commit -m "Finalize modularity and efficiency refactor"
          git push origin HEAD:chatgpt/modularity-efficiency-refactor
